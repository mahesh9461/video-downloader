version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - CLEANUP_TIMEOUT_SECONDS=600
      - RATE_LIMIT_PER_MINUTE=5
    volumes:
      - backend-downloads:/app/downloads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=/api/proxy
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-downloads:

